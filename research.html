    <t-member
    heading="Research Highlights"
    details="Below are highlighted results from ongoing and completed research projects that exemplify the main scientific interests and methodological approaches pursued by our group."
    bg="light"
    ></t-member>
    
    <t-member class="research-topic"
    heading="Strength and anisotropy of foliated rocks"
    details="<p>We investigate how mineral composition and foliation textures control the anisotropic response of rocks. Laboratory experiments help us understand how these rocks deform and fracture, providing a foundation for more reliable predictions of their behavior in engineering applications.</p>"
    profile-img="img/research_fig1_foliation.png"
    profile-alt="Foliation"
    profile-position="left"
    class-member-photo="research-photo"
    align="left"
    ></t-member>

    <t-member class="research-topic"
    heading="Modeling the mechanical behavior of fractured rock masses"
    details="<p>We develop three-dimensional numerical models to understand how networks of fractures influence the strength and deformation of rock masses. By varying fracture size, orientation, and abundance, we explore how geological structure affects mechanical behavior at different scales. This research helps connect observations of fractures to the properties needed for engineering design.</p>"
    profile-img="img/DFN-SRM.png"
    profile-alt="DFN-DEM for SRM Analysis"
    profile-position="left"
    class-member-photo="research-photo"
    align="left"
    ></t-member>

    <t-member class="research-topic"
    heading="Geological mapping and stability of rock excavations"
    details="<p>We combine three-dimensional imaging, geological mapping, and numerical modeling to study the stability of tunnels, underground mines, and open-pit slopes. Our research examines how fractures and other geological structures influence potential failure mechanisms, and how uncertainty in the subsurface can be incorporated into stability assessments. The aim is to support safer excavation design.</p>"
    profile-img="img/dfn-mechanical.png"
    profile-alt="TLS-DFN-DEM Modeling for Rock Excavation Assessment"
    profile-position="left"
    class-member-photo="research-photo"
    align="left"
    ></t-member>

    <t-member class="research-topic"
    heading="Water flow through fractured rock masses"
    details="<p>We study how water moves through interconnected fractures and how their geometry controls the permeability of rock masses. Three-dimensional fracture network models help us investigate preferential flow paths, water infiltration into tunnels, and hydraulic connections around excavations. We also develop computational tools to make these assessments more efficient.</p>"
    profile-img="img/dfn-fluid.png"
    profile-alt="DFN Modeling for Fluid Flow Analysis in Fractured Rock Masses"
    profile-position="left"
    class-member-photo="research-photo"
    align="left"
    ></t-member>

    <t-member class="research-topic"
    heading="3D-printed models for fractured rock experiments"
    details="<p>We use 3D printing to create physical models with controlled fracture networks and investigate water flow under laboratory conditions. These experiments reveal how fracture geometry and applied stress affect permeability, and provide a way to test and improve numerical predictions. The approach links physical observations with computational models of fractured rock.</p>"
    profile-img="img/lab-printed.png"
    profile-alt="3D-printed DFN for permeability testing"
    profile-position="left"
    class-member-photo="research-photo"
    align="left"
    ></t-member>

    <t-member class="research-topic"
    heading="Mechanical behavior of mine tailings"
    details="<p>We investigate how mine tailings deform and develop strength under different loading conditions, from low to high pressures. Laboratory tests explore the roles of particle characteristics, compaction, and particle breakage in their mechanical behavior. This research contributes to a better understanding of materials used in tailings storage and management.</p>"
    profile-img="img/Tailings.png"
    profile-alt="Critical state behavior of tailings"
    profile-position="left"
    class-member-photo="research-photo"
    align="left"
    ></t-member>
