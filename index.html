<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GRM² Research Group</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400;1,600&display=swap"
      rel="stylesheet"
      />

  <body>
    <t-header></t-header>
    <h1 class="welcome-title">
      Welcome to the Geomechanics &amp; Rock Mass Modeling research group
    </h1>
    
    <t-section
    selector="flex"
    details="Our group conducts research and consulting projects in geomechanics, with a focus on experimental rock mechanics and discontinuous rock mass modeling applied to rock excavation stability and fluid flow in fractured media.<br />
    Our main areas of expertise include:<br />
    <ul>
      <li>Laboratory testing in rock mechanics</li>
      <li>Mechanical behavior of anisotropic rocks</li>
      <li>Strength of geological structures</li>
      <li>Mapping and analysis of discontinuities using 3D imaging</li>
      <li>Fractured rock mass modeling using discrete fracture networks (DFN)</li>
      <li>Development of new DFN modeling tools and implementation of custom numerical codes</li>
      <li>Stability analysis of rock excavations using deterministic and probabilistic methods</li>
    </ul>"
      img="img/about-bg.jpg"
      show-image
    ></t-section>

    <t-main-section
    heading="Interested in joining our group?"
    details="We welcome inquiries from prospective MSc and PhD students interested in understanding how rocks and fractured rock masses behave. Our research combines laboratory experiments, geological characterization, and numerical modeling to address challenges in rock engineering. Explore our research themes and contact us to discuss your interests and potential opportunities. Please include your CV, academic transcripts, and a brief description of your research interests."
    link="mailto:pedro.cacciari@polymtl.ca?subject=Prospective%20graduate%20student%20-%20GRM2"
    link-text="Contact us"
    show-button
    ></t-main-section>
      
      <t-footer></t-footer>

    <script src="script.js"></script>
  </body>
</html>
